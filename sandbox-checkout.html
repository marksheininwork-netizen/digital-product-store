<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Sandbox Checkout</title><style>body{font:16px system-ui;background:#f5f8f5;color:#173e36;max-width:650px;margin:5rem auto;padding:1rem}button{padding:14px 20px;background:#173e36;color:white;border:0;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}select{padding:12px}p{line-height:1.6}</style></head><body><a href="./index.html">Northstar Studio</a><h1>Sandbox checkout API test</h1><p><strong>Test mode only.</strong> This page uses the Supabase checkout function. It will not charge real money. Checkout may be unavailable until sandbox secrets and prices are configured.</p><label for="sku">Test product</label> <select id="sku"><option value="membership">Toolbox Plus — $12/month</option><option value="focus">Product 1 (test)</option><option value="launch">Product 2 (test)</option><option value="creator">Product 3 (test)</option></select><button id="pay">Start test checkout</button><p id="status" role="status" aria-live="polite"></p><script>const endpoint='https://hwsavnkammbhgizltqrc.supabase.co/functions/v1/northstar-checkout';document.getElementById('pay').addEventListener('click',async()=>{const btn=document.getElementById('pay'),status=document.getElementById('status');btn.disabled=true;status.textContent='Starting sandbox checkout…';try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sku:document.getElementById('sku').value})});const j=await r.json();if(!r.ok||!j.url)throw Error(j.error||'Checkout unavailable');if(!j.url.startsWith('https://checkout.stripe.com/'))throw Error('Unexpected checkout URL');window.location.assign(j.url)}catch(e){status.textContent=e.message;btn.disabled=false}})</script></body></html>
