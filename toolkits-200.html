function markdown(p){const rows=p.steps.map((s,i)=>'| '+(i+1)+' | '+s+' | __________ | __________ |').join('\n');return '# '+p.title+'\n\nNorthstar Studio | '+p.id+' | Editable working template\n\n## Purpose\nUse this toolkit to manage '+p.workflow.toLowerCase()+' for '+p.audience.toLowerCase()+' handling '+p.job+'.\n\n## Quick-start\n1. Duplicate this file for each customer, campaign or project.\n2. Replace the blanks with real information.\n3. Complete the four actions in order and record evidence.\n4. Review results and adjust your process.\n\n## Project brief\n- Customer / project: __________\n- Desired result: __________\n- Deadline: __________\n- Responsible person: __________\n- Key constraint: __________\n- Success metric: __________\n\n## Four-step execution tracker\n| Step | Action | Owner | Due / status |\n| --- | --- | --- | --- |\n'+rows+'\n\n## Field-specific example\nImagine a '+p.audience.toLowerCase()+' business preparing '+p.job+'. Gather the '+p.artifact+' before beginning; use a '+p.review+' to confirm that the customer understands what will happen next.\n\n## Customer questions\n- What would a successful result look like for this project?\n- Which part of the current process causes the most frustration?\n- What information or approval is still missing?\n- When should we review progress together?\n\n## Quality and risk checks\n- [ ] All claims and promises are accurate\n- [ ] Customer permission and privacy requirements are respected\n- [ ] Deliverables and timing are clearly documented\n- [ ] A real person checked the output for errors\n- [ ] Next action has an owner and date\n\n## Review log\n| Date | Observation | Decision | Next action |\n| --- | --- | --- | --- |\n| ____ | ____ | ____ | ____ |\n\n## Improvement note\nWhat should be simplified or automated next time? __________\n\nEducational template. Adapt to your situation; no guaranteed business results.\n'}
function download(p){const blob=new Blob([markdown(p)],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=p.id+'-'+p.workflow.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function render(){const q=search.value.toLowerCase().trim(),items=products.filter(p=>(!audience.value||p.audience===audience.value)&&(!q||(p.title+' '+p.job).toLowerCase().includes(q)));count.textContent=items.length+' toolkits';grid.replaceChildren();for(const p of items){const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.title;h.style.fontSize='18px';const s=document.createElement('p');s.className='muted small';s.textContent=p.id+' · '+p.job;const d=document.createElement('p');d.textContent='Includes four-step tracker, project brief, customer prompts, QA and review log.';const b=document.createElement('button');b.textContent='Download editable toolkit';b.addEventListener('click',()=>download(p));c.append(h,s,d,b);grid.append(c)}}search.addEventListener('input',render);audience.addEventListener('change',render);render();
</script></body></html>
