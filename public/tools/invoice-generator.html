<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Invoice Generator — Northstar Studio</title><style>body{font:16px system-ui;background:#f5f6fb;color:#182238;margin:0}main{max-width:850px;margin:25px auto;background:white;padding:30px;border-radius:16px}h1{margin-top:0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid #b6c1d1;border-radius:7px}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}td input{min-width:50px}button{background:#1c2b4c;color:white;border:0;border-radius:8px;padding:12px;margin:15px 6px 0 0;cursor:pointer}.total{text-align:right;font-size:24px;font-weight:bold}@media(max-width:600px){main{padding:15px}.grid{grid-template-columns:1fr}}@media print{body{background:white}main{margin:0;padding:0}button,.help{display:none}input,textarea{border:0;padding:3px}td input{width:100%}}</style><main><p><a href="/">← Northstar Studio</a></p><h1>Invoice Generator</h1><p class="help">Free tool. Your invoice data stays in your browser. Print or save as PDF.</p><div class="grid"><div><label for="from">From</label><textarea id="from" placeholder="Your business name and address"></textarea></div><div><label for="to">Bill to</label><textarea id="to" placeholder="Client name and address"></textarea></div><div><label for="number">Invoice number</label><input id="number" placeholder="INV-001"></div><div><label for="date">Invoice date</label><input id="date" type="date"></div><div><label for="due">Due date</label><input id="due" type="date"></div><div><label for="currency">Currency</label><input id="currency" value="USD" maxlength="3" aria-label="ISO currency code"></div></div><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Amount</th><th></th></tr></thead><tbody id="items"></tbody></table><button id="add">Add item</button><div class="total" id="total" aria-live="polite"></div><label for="notes">Notes / payment instructions</label><textarea id="notes"></textarea><button onclick="window.print()">Print / Save PDF</button><p class="help">No accounts, tax calculation, or payment processing. Check invoice requirements for your jurisdiction.</p></main><script>const tbody=document.getElementById('items');const total=document.getElementById('total');document.getElementById('date').value=new Date().toISOString().slice(0,10);function add(){const tr=document.createElement('tr');tr.innerHTML='<td><input aria-label="Item description" placeholder="Service or product"></td><td><input aria-label="Quantity" type="number" min="0" step="0.01" value="1"></td><td><input aria-label="Unit price" type="number" min="0" step="0.01" value="0"></td><td class="amount">0.00</td><td><button type="button" aria-label="Remove item">×</button></td>';tr.querySelector('button').onclick=()=>{tr.remove();calc()};tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));tbody.append(tr);calc()}function calc(){let sum=0;tbody.querySelectorAll('tr').forEach(tr=>{const a=tr.querySelectorAll('input');const n=Math.max(0,Number(a[1].value)||0)*Math.max(0,Number(a[2].value)||0);tr.querySelector('.amount').textContent=n.toFixed(2);sum+=n});let currency=document.getElementById('currency').value.toUpperCase();try{total.textContent='Total: '+new Intl.NumberFormat('en-US',{style:'currency',currency}).format(sum)}catch{total.textContent='Total: '+sum.toFixed(2)}}document.getElementById('currency').addEventListener('input',calc);document.getElementById('add').onclick=add;add();</script></html>
