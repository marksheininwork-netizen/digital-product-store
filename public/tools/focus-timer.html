<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer — Northstar Studio</title><style>body{font:16px system-ui;background:#eef2fb;color:#17233a;margin:0;display:grid;place-items:center;min-height:100vh}main{text-align:center;background:white;padding:36px;border-radius:22px;max-width:430px;width:85%;box-shadow:0 15px 50px #1a2c5215}h1{margin:12px 0}#clock{font-size:70px;font-variant-numeric:tabular-nums;margin:22px 0;font-weight:700}button{padding:12px 18px;margin:5px;border:0;border-radius:9px;background:#243d72;color:white;cursor:pointer}button.secondary{background:#e7ecf7;color:#17233a}button:focus-visible{outline:3px solid #ffb547}p{color:#58657d}a{color:#243d72}#status{min-height:24px}</style><main><p><a href="/">← Northstar Studio</a></p><h1>Focus Timer</h1><p>Work with intention. Take a real break.</p><div><button class="secondary" data-min="25">Focus 25m</button><button class="secondary" data-min="5">Break 5m</button><button class="secondary" data-min="15">Break 15m</button></div><div id="clock" role="timer" aria-label="Remaining time">25:00</div><button id="start">Start</button><button id="reset" class="secondary">Reset</button><p id="status" aria-live="polite">Ready to focus</p><p>No sign-up. Runs locally in your browser.</p></main><script>let duration=1500,remaining=duration,running=false,deadline=0,interval;const clock=document.getElementById('clock'),start=document.getElementById('start'),status=document.getElementById('status');function render(){const m=Math.floor(remaining/60),s=remaining%60;clock.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.title=clock.textContent+' · Focus Timer'}function stop(){running=false;clearInterval(interval);start.textContent='Start'}function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));render();if(remaining===0){stop();status.textContent='Session finished!'}}start.onclick=()=>{if(running){tick();stop();status.textContent='Paused'}else{deadline=Date.now()+remaining*1000;running=true;start.textContent='Pause';status.textContent='Session running';interval=setInterval(tick,250)}};document.getElementById('reset').onclick=()=>{stop();remaining=duration;status.textContent='Ready';render()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{stop();duration=Number(b.dataset.min)*60;remaining=duration;status.textContent='Ready';render()});document.addEventListener('visibilitychange',()=>{if(running)tick()});render();</script></html>
